<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar(active='productos')}"></div>

<div class="main-content">
    <div class="top-header">
        <div class="page-title">
            <h1><i class="fas fa-box"></i> Gestión de Productos</h1>
            <p class="page-subtitle">Control de inventario y precios</p>
        </div>
        <a th:href="@{/productos/nuevo}" class="btn-primary">
            <i class="fas fa-plus"></i> Nuevo Producto
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success">
        <i class="fas fa-check-circle"></i> <span th:text="${success}">Éxito</span>
    </div>
    <div th:if="${error}" class="alert alert-danger">
        <i class="fas fa-exclamation-triangle"></i> <span th:text="${error}">Error</span>
    </div>

    <!-- Filtros -->
    <div class="card">
        <div class="card-header">
            <h2><i class="fas fa-filter"></i> Filtros</h2>
        </div>
        <div class="filter-bar">
            <a th:href="@{/productos}" class="btn-secondary">
                <i class="fas fa-list"></i> Todos
            </a>
            <a th:href="@{/productos/activos}" class="btn-secondary">
                <i class="fas fa-check-circle"></i> Activos
            </a>
        </div>
    </div>

    <div class="card">
        <table class="data-table">
            <thead>
            <tr>
                <th><i class="fas fa-hashtag"></i> ID</th>
                <th><i class="fas fa-tag"></i> Producto</th>
                <th><i class="fas fa-dollar-sign"></i> Precio</th>
                <th><i class="fas fa-boxes"></i> Stock</th>
                <th><i class="fas fa-circle"></i> Estado</th>
                <th><i class="fas fa-cogs"></i> Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="prod : ${productos}">
                <td th:text="${prod.codigoProducto}">1</td>
                <td th:text="${prod.nombreProducto}" style="font-weight: 600;">Producto</td>
                <td th:text="'Q' + ${prod.precio}">Q0.00</td>
                <td th:text="${prod.stock}">0</td>
                <td>
                        <span class="badge" th:classappend="${prod.estado == 1} ? 'badge-success' : 'badge-danger'"
                              th:text="${prod.estado == 1} ? 'Disponible' : 'Agotado'"></span>
                </td>
                <td>
                    <div class="action-buttons">
                        <a th:href="@{/productos/editar/{id}(id=${prod.codigoProducto})}" class="btn-sm btn-warning" title="Editar">
                            <i class="fas fa-edit"></i>
                        </a>
                        <a th:href="@{/productos/eliminar/{id}(id=${prod.codigoProducto})}" class="btn-sm btn-danger"
                           onclick="return confirm('¿Eliminar este producto?')" title="Eliminar">
                            <i class="fas fa-trash"></i>
                        </a>
                    </div>
                </td>
            </tr>
            <tr th:if="${productos.empty}">
                <td colspan="6" class="empty-row">
                    <i class="fas fa-inbox"></i> No hay productos registrados
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
