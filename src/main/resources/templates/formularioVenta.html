<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar(active='ventas')}"></div>

<div class="main-content">
    <div class="top-header">
        <div class="page-title">
            <h1><i class="fas fa-cart-plus"></i> <span th:text="${viewTitle}">Nueva Venta</span></h1>
            <p class="page-subtitle">Complete los datos de la transacción</p>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger">
        <i class="fas fa-exclamation-triangle"></i> <span th:text="${error}">Error</span>
    </div>

    <div class="card">
        <div class="card-header">
            <h2><i class="fas fa-shopping-cart"></i> Información de Venta</h2>
        </div>
        <form th:action="@{/ventas/guardar}" th:object="${venta}" method="post" class="form-grid">

            <!-- Cliente -->
            <div class="form-group">
                <label><i class="fas fa-user"></i> Cliente *</label>
                <select th:field="*{cliente.DPICliente}" class="form-control" required>
                    <option value="">Seleccione un cliente...</option>
                    <option th:each="cliente : ${clientes}"
                            th:value="${cliente.DPICliente}"
                            th:text="${cliente.nombreCliente + ' ' + cliente.apellidoCliente + ' - ' + cliente.DPICliente}">
                    </option>
                </select>
            </div>

            <!-- Fecha -->
            <div class="form-group">
                <label><i class="fas fa-calendar"></i> Fecha de Venta *</label>
                <input type="date" th:field="*{fechaVenta}" class="form-control" required>
            </div>

            <!-- Total -->
            <div class="form-group">
                <label><i class="fas fa-dollar-sign"></i> Total *</label>
                <input type="number" step="0.01" th:field="*{total}" class="form-control" id="total"
                       value="0.00" required>
                <small id="totalHelp" class="form-help">El total se calculará automáticamente al agregar productos</small>
            </div>

            <!-- Estado -->
            <input type="hidden" th:field="*{estado}" value="1">

            <!-- Usuario de sesión -->
            <input type="hidden" name="usuario.codigoUsuario"
                   th:value="${session.usuarioLogueado != null ? session.usuarioLogueado.codigoUsuario : 1}">

            <div class="form-actions">
                <a th:href="@{/ventas}" class="btn-secondary">
                    <i class="fas fa-times"></i> Cancelar
                </a>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> Crear Venta
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function toggleTotalInput() {
    const tipoTotal = document.querySelector('input[name="tipoTotal"]:checked').value;
    const totalInput = document.getElementById('total');
    const totalHelp = document.getElementById('totalHelp');
    
    if (tipoTotal === 'manual') {
        totalInput.removeAttribute('readonly');
        totalInput.style.backgroundColor = 'white';
        totalInput.style.cursor = 'text';
        totalHelp.textContent = 'Ingrese el total manualmente';
        totalHelp.style.color = 'var(--naranja-vibrante)';
    } else {
        totalInput.setAttribute('readonly', true);
        totalInput.style.backgroundColor = '#f8f9fa';
        totalInput.style.cursor = 'not-allowed';
        totalHelp.textContent = 'El total se calculará automáticamente al agregar productos';
        totalHelp.style.color = '#666';
    }
}

// Inicializar al cargar la página
document.addEventListener('DOMContentLoaded', function() {
    toggleTotalInput();
});
</script>

<style>
.form-grid {
    display: grid;
    gap: 25px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.radio-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 8px;
}

.radio-label {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    padding: 12px 16px;
    border: 2px solid var(--azul-glacial);
    border-radius: 10px;
    transition: all 0.3s ease;
}

.radio-label:hover {
    border-color: var(--azul-kinal);
    background: rgba(0, 59, 115, 0.05);
}

.radio-label input[type="radio"] {
    accent-color: var(--naranja-vibrante);
}

.radio-label input[type="radio"]:checked + .radio-text {
    color: var(--azul-kinal);
    font-weight: 600;
}

.radio-text {
    font-size: 14px;
    color: var(--gris-asfalto);
}

.form-help {
    margin-top: 8px;
    font-size: 12px;
    color: #666;
    font-style: italic;
}

.form-actions {
    display: flex;
    gap: 15px;
    justify-content: flex-end;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid var(--azul-glacial);
}

.info-steps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.step {
    display: flex;
    align-items: flex-start;
    gap: 15px;
    padding: 20px;
    background: linear-gradient(135deg, rgba(0, 59, 115, 0.02) 0%, rgba(241, 143, 1, 0.02) 100%);
    border-radius: 12px;
    border-left: 3px solid var(--naranja-vibrante);
}

.step-number {
    width: 30px;
    height: 30px;
    background: var(--naranja-vibrante);
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    flex-shrink: 0;
}

.step-content h4 {
    color: var(--azul-kinal);
    font-size: 16px;
    margin-bottom: 5px;
    font-weight: 600;
}

.step-content p {
    color: var(--gris-asfalto);
    font-size: 14px;
    margin: 0;
    opacity: 0.8;
}
</style>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
